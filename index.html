<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente Brainstorming</title>
    <link rel="stylesheet" href="style.css" />

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest" type="text/javascript"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Notable&display=swap" rel="stylesheet">

</head>
<body>
    <div class="contenedor-general">
        <div class="contenedor-titulo">
            <h1>ASISTENTE BRAINSTORMING</h1>
        </div>
        
        <div class="fila-central">
            <div class="box contenedor-pdf">
                Zona para pdfs
            </div>

            <div class="box contenedor-zona-canva">
                <div class="area-botones-analizar-canva">
                    <button class="btn-analizar-canva">Analizar</button>
                </div>
                <div class="canva">
                    <canvas id="canvas">
                        Elemento canva
                    </canvas>                    
                </div>
                <div class="area-botones">
                    <button class="btn-circular" data-color="#000000" style="background: #000000;"></button>
                    <button class="btn-circular" data-color="#fb1818" style="background: #fb1818;"></button>
                    <button class="btn-circular" data-color="#3498db" style="background: #3498db;"></button>
                    <button class="btn-circular" data-color="#48ff00" style="background: #48ff00;"></button>
                    <button class="btn-circular" id="btnBorrador" title="Goma de borrar">
                        <img src="iconos/goma.png" alt="Goma" class="icono-img" style="height:70%">
                    </button>
                    <input type="range" min="1" max="80" value="5" id="sliderControl">
                </div>
            </div>

            <div class="box contenedor-lateral" style="display: flex; flex-direction: column; gap: 10px;">
                <h3 style="margin: 0; text-align: center;">Transcripción</h3>
                
                <div id="transcription-output" style="
                    flex-grow: 1; 
                    background: rgba(0,0,0,0.2); 
                    border-radius: 10px; 
                    padding: 10px; 
                    overflow-y: auto; 
                    font-size: 0.9em; 
                    min-height: 200px;
                    border: 1px solid #333;">
                    <em style="color: #666;">El texto aparecerá aquí...</em>
                </div>

                <button id="btn-record" class="btn-analizar-canva" style="width: 100%; background-color: #e74c3c;">
                    🎤 Iniciar Grabación
                </button>
            </div>
        </div>
        
        <div class="box fila-inferior">
            Interactuar con chatbot
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        // Configurar el worker de PDF.js
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>

    <script src="js/canvas.js"></script>
    <script type="module" src="js/index.js"></script>
</body>
</html>
